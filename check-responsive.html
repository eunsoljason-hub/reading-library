<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>반응형 확인용 임시 페이지</title>
<style>
  html, body { margin: 0; background: #e9e3d7; font: 13px system-ui, sans-serif; }
  .row { display: flex; gap: 18px; padding: 18px; align-items: flex-start; }
  .frame { background: #fff; border-radius: 12px; box-shadow: 0 8px 24px -14px rgba(0,0,0,.5); overflow: hidden; }
  .cap { padding: 6px 10px; color: #55483a; font-weight: 600; }
  iframe { display: block; border: 0; }
</style>
</head>
<body>
<div class="row">
  <div class="frame">
    <div class="cap">모바일 390×760 (2열)</div>
    <iframe src="./" width="390" height="760" title="모바일 미리보기"></iframe>
  </div>
  <div class="frame">
    <div class="cap">태블릿 820×760 (3열)</div>
    <iframe src="./" width="820" height="760" title="태블릿 미리보기"></iframe>
  </div>
</div>
</body>
</html>
